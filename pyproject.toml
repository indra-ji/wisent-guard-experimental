[project]
name = "wisent-guard-experimental"
version = "0.1.0"
description = "My version of the WisentGuard OS repo"
readme = "README.md"
requires-python = ">= 3.9"
dependencies = [
    "bigcode-eval",
    "datasets>=2.0.0",
    "docker>=5.0.0",
    "lm-eval==0.4.8",
    "matplotlib>=3.3.0",
    "nltk>=3.8.0",
    "numpy>=1.21.0",
    "pandas>=1.2.0",
    "pytest>=6.0.0",
    "pyyaml>=5.4.0",
    "requests>=2.25.0",
    "ruff>=0.12.4",
    "scikit-learn>=0.24.0",
    "seaborn>=0.11.0",
    "sentence-transformers>=2.0.0",
    "torch>=1.9.0",
    "tqdm>=4.50.0",
    "transformers>=4.20.0",
    "ty>=0.0.1a15",
]

[tool.pytest.ini_options]
testpaths = ["wisent_guard/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--ignore=bigcode-evaluation-harness", "--ignore=evaluation"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "mbpp: marks tests specific to MBPP task",
    "gsm8k: marks tests specific to GSM8K task",
    "task_pipeline: marks tests for task pipeline functionality",
    "docker: marks tests for Docker-based execution",
    "performance: marks tests for performance evaluation",
    "cli: marks tests for CLI integration",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.uv.sources]
bigcode-eval = { git = "https://github.com/bigcode-project/bigcode-evaluation-harness.git" }
